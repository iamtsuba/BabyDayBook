<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151619">
<meta name="color-scheme" content="dark">
<title>Baby Day Book</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Day Book">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151619; --bg2:#1b1d21; --card:#23252a; --card2:#2c2f36; --text:#eceef1; --muted:#9a9fa8;
  --line:rgba(255,255,255,.08); --danger:#ef4444; --accent:#3dd6c6; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}
.hide{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}

/* En-tête */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg)}
.childbtn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;min-width:0}
.childbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.avatar{position:relative;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3dd6c6,#3b82f6);display:grid;place-items:center;font-weight:800;overflow:hidden;color:#06222a;flex:0 0 auto}
.avatar i{font-style:normal}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ibtn:active{background:var(--card)}

/* Actions rapides */
.quick{display:flex;gap:4px;overflow-x:auto;padding:12px 14px 14px;background:var(--bg2);scrollbar-width:none;border-radius:18px 18px 0 0}
.quick::-webkit-scrollbar{display:none}
.qa{flex:0 0 auto;width:82px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.qa .circ{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--c);box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .12s}
.qa:active .circ{transform:scale(.92)}
.qa .stt{font-size:11.5px;font-weight:700;line-height:1.2;min-height:14px;color:var(--text)}
.qa .nm2{font-size:10.5px;color:var(--muted);line-height:1.1}
.qa.run .circ{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--c)}

/* Jour */
.daybar{display:flex;align-items:center;gap:6px;padding:14px 14px 8px}
.daylabel{position:relative;font-weight:600;border-bottom:1px dashed var(--muted);padding-bottom:2px}
.daylabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0}
.daybar .ibtn{width:32px;height:32px}
.tdy{font-size:12px;font-weight:700;color:var(--accent);padding:5px 10px;border-radius:999px;background:rgba(61,214,198,.12)}

/* Frise */
.tl{position:relative;background:var(--bg2);border-radius:14px;margin:0 12px;overflow:hidden}
.tl .in{position:absolute;left:14px;right:14px;top:0;bottom:0}
.tl .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl .hl{position:absolute;bottom:2px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.tl .mk{position:absolute;transform:translateX(-50%);line-height:1;padding:0}
.tl .bar{position:absolute;height:12px;border-radius:3px;min-width:3px;padding:0}
.tl .now{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.75}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.tabs .tb{pointer-events:auto;display:flex;width:100%;max-width:560px;background:rgba(27,29,33,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700}
.tabs button.on{color:var(--accent)}
.ptitle{font-weight:800;font-size:19px;padding:4px 0}

/* Chronologie (semaine) */
.wknav{display:flex;align-items:center;gap:6px;padding:14px 14px 10px}
.wknav .ttl{font-weight:700;flex:1;text-align:center}
.wkgrid{padding:0 12px}
.wk{display:grid;grid-template-columns:40px 1fr;gap:8px;width:100%;text-align:left;margin-bottom:12px;align-items:start}
.wk .wl{display:flex;flex-direction:column;align-items:center;padding-top:4px;line-height:1.15;color:var(--muted);font-size:12px;text-transform:uppercase}
.wk .wl span{font-size:18px;font-weight:800;color:var(--text)}
.wk .wl.td span{color:var(--accent)}
.wk .tl{margin:0}
.wk.fut{opacity:.4}
.wsum{font-size:12px;color:var(--muted);margin:5px 2px 0;min-height:15px}
.wax .axis{position:relative;height:16px}
.wax .axis .in{position:absolute;left:14px;right:14px;top:0;bottom:0}
.wax .axis span{position:absolute;top:0;font-size:10px;color:var(--muted);transform:translateX(-50%)}

/* Mon compte */
.sec{padding:14px}
.sec .sh2{font-weight:800;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px}
.kv b{color:var(--text);word-break:break-all;text-align:right}
.sec .btn{width:100%;margin-top:8px}
.sec input{margin-bottom:0}

/* Cartes */
.card{background:var(--card);border-radius:14px;margin:12px 12px 0;overflow:hidden}
.sumhead{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;font-weight:600;color:var(--muted)}
.sumhead svg{transition:transform .2s}
.sumhead.open svg{transform:rotate(180deg)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.srow .si{width:22px;text-align:center;font-size:16px}
.srow .sn{font-weight:800;min-width:22px}
.srow .sd{color:var(--muted);font-size:13px}
.empty{padding:26px 18px;text-align:center;color:var(--muted);line-height:1.5}

/* Liste d'activités */
.list{margin:12px 12px 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--card);border-radius:14px;cursor:pointer;text-align:left;width:100%}
.row:active{background:var(--card2)}
.ri{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.rm{flex:1;min-width:0}
.rt{font-weight:700;font-size:15px}
.rs2{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
.nt{color:var(--muted);font-size:12.5px;margin-top:3px;font-style:italic}
.tr{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;opacity:.55;font-size:15px}
.tr:active{background:rgba(239,68,68,.2);opacity:1}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;border:1.5px solid var(--c);color:var(--c)}
.pill.on{background:var(--c);color:#fff}

/* Modales */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:93dvh;background:var(--card);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.stl{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.stl .dot{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:16px}
.x{width:34px;height:34px;border-radius:50%;background:var(--danger);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.sb{padding:8px 16px 4px;overflow-y:auto}
.sf{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sf .btn{flex:1}
.btn{padding:13px 16px;border-radius:14px;font-weight:800;font-size:15px;text-align:center}
.btn.pri{background:var(--accent);color:#06222a}
.btn.danger{border:1.5px solid var(--danger);color:var(--danger);flex:0 0 auto}
.btn.ghost{background:var(--card2)}
.btn:disabled{opacity:.5}
.fr{margin-bottom:12px}
.fr>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px 6px;border-radius:14px;background:var(--card2);border:2px solid transparent;font-weight:700;font-size:13px;line-height:1.5}
.seg button span{font-size:24px}
.seg button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card2))}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}
.step button{border-radius:12px;background:var(--card2);font-size:22px;font-weight:700}
.step input{text-align:center;font-size:20px;font-weight:700}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:600}
.timers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tm{background:var(--card2);border-radius:16px;padding:12px;text-align:center}
.tm .tl2{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tm .dg{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 8px}
.tm .tbtn{width:100%;padding:10px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;font-size:14px}
.tm.act{box-shadow:inset 0 0 0 2px var(--c)}
.tm .man{display:flex;align-items:center;gap:6px;margin-top:8px;justify-content:center;color:var(--muted);font-size:12px}
.tm .man input{width:64px;padding:6px 8px;text-align:center;font-size:15px}
.tot{text-align:center;color:var(--muted);margin:2px 0 12px}
.tot b{color:var(--text);font-size:18px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.info{color:var(--muted);line-height:1.5;font-size:14px;margin:4px 0 14px}
.lnk{display:block;width:100%;text-align:center;color:var(--muted);padding:10px;font-size:13px;text-decoration:underline}
.chrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;background:var(--card2);margin-bottom:8px;text-align:left;font-weight:700}
.chrow.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chrow .ed{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600}

/* Connexion */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.authc{width:100%;max-width:380px}
.logo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 8px 30px rgba(59,130,246,.35)}
.authc h1{text-align:center;margin:0 0 4px;font-size:26px;font-weight:800}
.authc p.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.err{background:rgba(239,68,68,.14);color:#ff8a8a;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f3f4f6;color:#111;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:200;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.loading{display:grid;place-items:center;min-height:60dvh;color:var(--muted)}
</style>
</head>
<body>

<div id="boot" class="loading">Chargement…</div>

<div id="auth" class="auth hide">
  <form class="authc" id="authForm" autocomplete="on">
    <img class="logo" src="icon-192.png" alt="">
    <h1>Baby Day Book</h1>
    <p class="sub" id="authSub">Connecte-toi pour retrouver la journée de bébé</p>
    <div id="authErr" class="err hide"></div>
    <div class="fr"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="fr"><label for="pwd">Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" minlength="6" required></div>
    <button class="btn pri" id="authBtn" type="submit" style="width:100%">Se connecter</button>
    <button class="lnk" id="authToggle" type="button">Pas encore de compte ? Créer un compte</button>
  </form>
</div>

<div id="app" class="hide">
  <header class="top">
    <button class="childbtn" data-act="childMenu" id="childBtn"></button>
    <div class="ptitle hide" id="pTitle">Mon compte</div>
  </header>
  <div id="pageHome">
    <div id="view">
      <div class="quick" id="quick"></div>
      <div id="daysec">
        <div class="daybar" id="daybar"></div>
        <div class="tl" id="tl"></div>
        <div class="card" id="summary"></div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </div>
  <div id="pageChrono" class="hide"></div>
  <div id="pageAccount" class="hide"></div>
  <nav class="tabs" id="tabs"><div class="tb">
    <button class="on" data-tab="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Accueil</button>
    <button data-tab="chrono"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h8"/><circle cx="18" cy="6" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>Chronologie</button>
    <button data-tab="account"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Mon compte</button>
  </div></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ───────── Configuration ───────── */
const SUPABASE_URL='https://uhsodmpqoporeiebhvwt.supabase.co';
const SUPABASE_KEY='sb_publishable_QWvqHKDxPisbpahTcXuwVw_evcXHVif';
const APP_VERSION='26.11.27.2341';
const TZ='Europe/Paris';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ───────── Types d'activité ───────── */
const TYPES={
  allaitement:{label:'Allaitement',icon:'🤱',color:'#ee4b82'},
  tirelait:{label:'Tire-lait',icon:'🥛',color:'#a66bd6'},
  biberon:{label:'Biberon',icon:'🍼',color:'#2fa2ee'},
  bain:{label:'Bain',icon:'🛁',color:'#3b82f6'},
  couche:{label:'Couche',icon:'🩲',color:'#34c98a'},
  sommeil:{label:'Sommeil',icon:'🌙',color:'#8bc34a'},
  medicament:{label:'Médicament',icon:'💊',color:'#22c3d6'}
};
const ORDER=['allaitement','biberon','couche','sommeil','bain','tirelait','medicament'];
const DIAPER={urine:{label:'Pipi',icon:'💧'},selles:{label:'Selles',icon:'💩'},mixte:{label:'Mixte',icon:'🚽'}};
const RUNNING_TYPES=['allaitement','sommeil'];

/* ───────── Heure de Paris ───────── */
const parisStr=d=>d.toLocaleString('sv-SE',{timeZone:TZ}); // YYYY-MM-DD HH:MM:SS
function parisParts(d){const s=parisStr(d);return{date:s.slice(0,10),time:s.slice(11,16)}}
function parisOffsetMs(utcMs){
  const s=parisStr(new Date(utcMs));
  const y=+s.slice(0,4),mo=+s.slice(5,7),d=+s.slice(8,10),h=+s.slice(11,13),mi=+s.slice(14,16),se=+s.slice(17,19);
  return Date.UTC(y,mo-1,d,h,mi,se)-Math.floor(utcMs/1000)*1000;
}
function parisLocalToISO(date,time){
  const y=+date.slice(0,4),mo=+date.slice(5,7),d=+date.slice(8,10),h=+time.slice(0,2),mi=+time.slice(3,5);
  const asUTC=Date.UTC(y,mo-1,d,h,mi,0);
  let t=asUTC-parisOffsetMs(asUTC);
  t=asUTC-parisOffsetMs(t);
  return new Date(t).toISOString();
}
function addDays(day,n){const d=new Date(Date.UTC(+day.slice(0,4),+day.slice(5,7)-1,+day.slice(8,10)+n));return d.toISOString().slice(0,10)}
function parisDateRange(day){return{start:Date.parse(parisLocalToISO(day,'00:00')),end:Date.parse(parisLocalToISO(addDays(day,1),'00:00'))}}
const todayStr=()=>parisParts(new Date()).date;
const hm=ms=>parisParts(new Date(ms)).time;
function nowISO(){const d=new Date();d.setSeconds(0,0);return d.toISOString()}

/* Découpe un sommeil (ou toute durée) par jour de Paris */
function splitSleepByDay(e){
  const s=Date.parse(e.started_at),en=e.ended_at?Date.parse(e.ended_at):Date.now(),out=[];
  if(!(en>s))return out;
  let day=parisParts(new Date(s)).date;
  for(let g=0;g<60;g++){
    const r=parisDateRange(day),a=Math.max(s,r.start),b=Math.min(en,r.end);
    if(b>a)out.push({day,start:a,end:b,ms:b-a});
    if(en<=r.end)break;
    day=addDays(day,1);
  }
  return out;
}

/* ───────── Formats ───────── */
function fmtMS(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;if(m>=60)return`${Math.floor(m/60)}h ${m%60}m`;return m?`${m}m ${s}s`:`${s}s`}
function fmtHM(ms){const m=Math.max(0,Math.floor(ms/60000)),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`}
function noteFmt(sec){return`${Math.floor(sec/60)}m${sec%60}s`}
function agoLabel(ms){
  const m=Math.floor(ms/60000);
  if(m<1)return"À l'instant";
  if(m<60)return`Il y a ${m}m`;
  const h=Math.floor(m/60);
  if(h<24)return`Il y a ${h}h ${m%60}m`;
  return`Il y a ${Math.floor(h/24)}j ${h%24}h`;
}
function ageText(birth,day){
  if(!birth)return null;
  const by=+birth.slice(0,4),bm=+birth.slice(5,7),bd=+birth.slice(8,10),y=+day.slice(0,4),m=+day.slice(5,7),d=+day.slice(8,10);
  const days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(by,bm-1,bd))/864e5);
  if(days<0)return'Pas encore né';
  if(days<31)return`${days}j (Semaine ${Math.floor(days/7)+1})`;
  let months=(y-by)*12+(m-bm),dd=d-bd;
  if(dd<0){months--;dd+=new Date(Date.UTC(y,m-1,0)).getUTCDate()}
  const yrs=Math.floor(months/12),mo=months%12;
  if(yrs>=1)return`${yrs} an${yrs>1?'s':''}${mo?` ${mo} mois`:''}`;
  return`${months} mois${dd?` ${dd}j`:''}`;
}
function dayTitle(day){
  const t=todayStr();
  const lab=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:TZ}).format(new Date(parisLocalToISO(day,'12:00')));
  if(day===t)return`Aujourd'hui, ${lab}`;
  if(day===addDays(t,-1))return`Hier, ${lab}`;
  return lab;
}
function nursingSecs(e,now){
  now=now||Date.now();
  let l=e.left_sec||0,r=e.right_sec||0;
  if(e.active_side&&e.active_since){
    const d=Math.max(0,Math.floor((now-Date.parse(e.active_since))/1000));
    if(e.active_side==='left')l+=d;else r+=d;
  }
  return{l,r,t:l+r};
}

function overlaps(e,r){
  const s=Date.parse(e.started_at),en=e.ended_at?Date.parse(e.ended_at):Infinity;
  return s<r.end&&(en>r.start||s>=r.start);
}
async function loadAll(){

  const from=new Date(r.start-36*3600e3).toISOString(),to=new Date(r.end).toISOString();
  const[dayRes,runRes,recRes]=await Promise.all([
    sb.from('babydaybook_events').select('*').eq('child_id',id).gte('started_at',from).lt('started_at',to).order('started_at',{ascending:false}),
    sb.from('babydaybook_events').select('*').eq('child_id',id).is('ended_at',null).in('type',RUNNING_TYPES),
    sb.from('babydaybook_events').select('*').eq('child_id',id).order('started_at',{ascending:false}).limit(150)
  ]);
  const err=dayRes.error||runRes.error||recRes.error;
  if(err){dbErr(err);return}
  S.running=runRes.data||[];
  S.recent=recRes.data||[];
  const evs=(dayRes.data||[]).slice();
  for(const x of S.running)if(!evs.some(e=>e.id===x.id)&&Date.parse(x.started_at)<r.end)evs.push(x);
  S.events=evs.filter(e=>overlaps(e,r)).sort((a,b)=>Date.parse(b.started_at)-Date.parse(a.started_at));

function stripHTML(day,events,opt){
  opt=opt||{};const compact=!!opt.compact,inter=opt.interactive!==false;
  const r=parisDateRange(day),span=r.end-r.start;
  const pct=ms=>Math.min(100,Math.max(0,(ms-r.start)/span*100));
  const bars=[],marks=[];
  for(const e of events){
    if(e.type==='sommeil'||e.type==='allaitement'){
      for(const g of splitSleepByDay(e))if(g.day===day)bars.push({e,l:pct(g.start),w:Math.max(pct(g.end)-pct(g.start),.8)});
    }else{
      const s=Date.parse(e.started_at);
      if(s>=r.start&&s<r.end)marks.push({e,x:pct(s),icon:e.type==='couche'&&e.diaper_type?DIAPER[e.diaper_type].icon:TYPES[e.type].icon});
    }
  }
  marks.sort((a,b)=>a.x-b.x);
  const gap=compact?7:5.5,RH=compact?15:19,rows=[];
  for(const m of marks){let i=0;while(rows[i]!==undefined&&m.x-rows[i]<gap)i++;rows[i]=m.x;m.row=i}
  const R=Math.max(1,rows.length),top=4+R*RH,H=top+18+(compact?2:14);
  let h='';
  for(let k=0;k<=24;k+=2){
    const x=k/24*100;
    if(k>0&&k<24)h+=`<div class="g" style="left:${x}%"></div>`;
    if(!compact)h+=`<span class="hl" style="left:${x}%">${k}</span>`;
  }
  for(const b of bars){
    const st=`left:${b.l}%;width:${b.w}%;top:${top+2}px;background:${TYPES[b.e.type].color}`;
    h+=inter?`<button class="bar" data-act="edit" data-id="${b.e.id}" style="${st}" aria-label="${TYPES[b.e.type].label}"></button>`:`<span class="bar" style="${st}"></span>`;
  }
  for(const m of marks){
    const st=`left:${m.x}%;top:${4+m.row*RH}px;font-size:${compact?12:14}px`;
    h+=inter?`<button class="mk" data-act="edit" data-id="${m.e.id}" style="${st}" aria-label="${TYPES[m.e.type].label}">${m.icon}</button>`:`<span class="mk" style="${st}">${m.icon}</span>`;
  }
  if(day===todayStr())h+=`<div class="now" style="left:${pct(Date.now())}%"></div>`;
  return`<div style="position:relative;height:${H}px"><div class="in">${h}</div></div>`;
}

function summaryData(evs,day){

  }else if(type==='tirelait'){

      <div class="fr"><label>Droite (ml)</label><input id="f-r" type="number" inputmode="decimal" min="0" value="${e&&e.right_ml!=null?+e.right_ml:''}"></div></div>

      `<div class="fr"><label>Dose / notes</label><textarea id="f-notes" rows="2">${esc(e&&e.notes||'')}</textarea></div>`;
  }
  const ov=openModal({title:T.label,icon:T.icon,color:T.color,body,footer:footerEdit(e)});
  const q=s=>$(s,ov);
  if(type==='couche')q('#seg').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;$$('#seg button',ov).forEach(x=>x.classList.toggle('on',x===b))});
  if(type==='biberon'){

function openSleep(e){
  const T=TYPES.sommeil;
  const body=`<div class="fr"><label>Début</label>${dtFields('f',e?e.started_at:nowISO())}</div>
    <div class="fr"><label>Fin</label>${dtFields('g',e?e.ended_at:null)}<div class="hint" id="slHint"></div></div>
    <div class="fr"><label>Notes</label><textarea id="f-notes" rows="2">${esc(e&&e.notes||'')}</textarea></div>`;
  const running=e&&!e.ended_at;
  const footer=`${e?'<button class="btn danger" data-m="del">🗑</button>':''}${running?'<button class="btn ghost" data-m="now">☀️ Réveil</button>':''}<button class="btn pri" data-m="save" id="slSave">${e?'Enregistrer':'Démarrer'}</button>`;
  const ov=openModal({title:T.label,icon:T.icon,color:T.color,body,footer});
  const q=s=>$(s,ov);
  const upd=()=>{
    const s=readDt('f'),en=readDt('g');
    q('#slHint').textContent=!en?'Fin vide = bébé dort encore (chrono en cours).':(s&&en>s?`Durée : ${fmtHM(Date.parse(en)-Date.parse(s))}`:'');
    q('#slSave').textContent=!en&&!e?'Démarrer':'Enregistrer';
  };
  ov.addEventListener('input',upd);upd();
  async function save(){
    const s=readDt('f'),en=readDt('g');
    if(!s){toast('Début invalide');return}
    if(en&&Date.parse(en)<=Date.parse(s)){toast('La fin doit être après le début');return}
    const b=q('#slSave');b.disabled=true;
    const ok=await saveEvent(e,{type:'sommeil',started_at:s,ended_at:en||null,notes:q('#f-notes').value.trim()||null});

function openNursing(e){
  const T=TYPES.allaitement;
  let dr=e?{...e}:{id:null,started_at:nowISO(),ended_at:null,left_sec:0,right_sec:0,active_side:null,active_since:null,notes:''};
  let used=false,lastAuto=null,manualMin=false;
  const body=`<div class="fr"><label>Début</label>${dtFields('f',dr.started_at)}</div>
    <div class="timers" style="--c:${T.color}">${['left','right'].map(s=>`<div class="tm" id="tm-${s}">
      <div class="tl2">${s==='left'?'Gauche':'Droite'}</div><div class="dg" id="dg-${s}">00:00</div>
      <button type="button" class="tbtn" data-t="${s}">▶ Démarrer</button>
      <div class="man"><input type="number" inputmode="numeric" min="0" id="mn-${s}" aria-label="Minutes ${s==='left'?'gauche':'droite'}"><span>min</span></div></div>`).join('')}</div>
    <div class="tot">Total <b id="tot">0s</b></div>
    <div class="fr"><label>Notes</label><textarea id="f-notes" rows="2"></textarea></div>`;
  const footer=`${e?'<button class="btn danger" data-m="del">🗑</button>':''}<button class="btn pri" data-m="save">${e&&!e.ended_at?'Terminer':'Enregistrer'}</button>`;
  let iv=null;
  const ov=openModal({title:T.label,icon:T.icon,color:T.color,body,footer,cleanup:()=>clearInterval(iv)});
  const q=s=>$(s,ov);
  const autoNote=()=>{const c=nursingSecs(dr),p=[];if(c.l>0)p.push('G:'+noteFmt(c.l));if(c.r>0)p.push('D:'+noteFmt(c.r));return p.join(' / ')};
  q('#f-notes').value=dr.notes||autoNote();
  lastAuto=(!dr.notes||dr.notes===autoNote())?autoNote():null;
  function paint(){
    const c=nursingSecs(dr);
    for(const s of['left','right']){
      const sec=s==='left'?c.l:c.r,act=dr.active_side===s;
      q('#dg-'+s).textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`;
      q('#tm-'+s).classList.toggle('act',act);
      q(`[data-t="${s}"]`).textContent=act?'⏸ Pause':(sec>0?'▶ Reprendre':'▶ Démarrer');
      const mi=q('#mn-'+s);if(document.activeElement!==mi)mi.value=Math.floor(sec/60);
    }
    q('#tot').textContent=fmtMS(c.t);
    const a=autoNote(),ta=q('#f-notes');
    if(ta.value===lastAuto||ta.value==='')ta.value=a;
    lastAuto=a;
  }
  paint();iv=setInterval(paint,500);
  async function toggle(side){
    const now=new Date(),c=nursingSecs(dr,now.getTime());
    const patch={left_sec:c.l,right_sec:c.r};
    if(dr.active_side===side){patch.active_side=null;patch.active_since=null}
    else{patch.active_side=side;patch.active_since=now.toISOString();patch.ended_at=null}
    used=true;
    let row;
    if(!dr.id)row=await insertEvent({type:'allaitement',started_at:readDt('f')||dr.started_at,ended_at:null,notes:q('#f-notes').value.trim()||null,...patch});
    else row=await updateEvent(dr.id,patch);
    if(!row)return;
    dr=row;paint();loadAll();
  }
  ov.addEventListener('input',ev=>{
    const m=ev.target.id&&ev.target.id.match(/^mn-(left|right)$/);
    if(!m||dr.active_side===m[1])return;
    manualMin=true;dr[m[1]+'_sec']=Math.max(0,Math.round((+ev.target.value||0)*60));paint();
  });
  async function save(btn){
    const iso=readDt('f');if(!iso){toast('Date ou heure invalide');return}
    const c=nursingSecs(dr);
    if(c.t<=0&&!dr.id){toast('Ajoute un temps ou lance un chrono');return}
    const wasRunning=dr.id&&dr.ended_at==null;
    const startChanged=Math.floor(Date.parse(iso)/60000)!==Math.floor(Date.parse(dr.started_at)/60000);
    // Fin = début + temps des deux seins pour une saisie manuelle ; fin = maintenant pour un chrono en direct ;
    // fin inchangée si on ne touche ni au début ni aux durées d'une activité déjà terminée.
    let ended;
    if(dr.id&&dr.ended_at&&!used&&!startChanged&&!manualMin)ended=dr.ended_at;
    else if(manualMin||(!used&&!wasRunning))ended=new Date(Date.parse(iso)+c.t*1000).toISOString();
    else ended=new Date().toISOString();
    const patch={started_at:iso,left_sec:c.l,right_sec:c.r,active_side:null,active_since:null,notes:q('#f-notes').value.trim()||null,ended_at:ended};
    btn.disabled=true;
    const ok=dr.id?await updateEvent(dr.id,patch):await insertEvent({type:'allaitement',...patch});
    if(!ok){btn.disabled=false;return}
    closeModal();await loadAll();
  }
  ov.addEventListener('click',async ev=>{
    const t=ev.target.closest('[data-t]');
    if(t){toggle(t.dataset.t);return}
    const m=ev.target.closest('[data-m]');if(!m)return;
    if(m.dataset.m==='save')save(m);
    else if(m.dataset.m==='del'){
      if(dr.id){if(!confirm('Supprimer cette activité ?'))return;if(await deleteEvent(dr.id)){closeModal();await loadAll()}}
      else closeModal();
    }
  });
}

  const ov=openModal({title:welcome?'Bienvenue 👋':(c?'Modifier l\'enfant':'Nouvel enfant'),body,footer,closable:!welcome});

const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showTab(t){
  S.tab=t;
  $('#pageHome').classList.toggle('hide',t!=='home');
  $('#pageChrono').classList.toggle('hide',t!=='chrono');
  $('#pageAccount').classList.toggle('hide',t!=='account');
  $('#childBtn').classList.toggle('hide',t==='account');
  $('#pTitle').classList.toggle('hide',t!=='account');
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));

async function setTab(t){
  showTab(t);
  if(t==='chrono'){S.weekStart=weekStartOf(todayStr());await loadWeek()}
  else if(t==='account')renderAccount();
  else await loadAll();
}
function weekStartOf(day){
  const dow=(new Date(Date.UTC(+day.slice(0,4),+day.slice(5,7)-1,+day.slice(8,10))).getUTCDay()+6)%7;
  return addDays(day,-dow);
}
async function loadWeek(){
  if(!S.child||!S.weekStart)return;
  const ws=S.weekStart,r0=parisDateRange(ws).start,r1=parisDateRange(addDays(ws,7)).start,id=S.child.id;
  const[a,b]=await Promise.all([
    sb.from('babydaybook_events').select('*').eq('child_id',id).gte('started_at',new Date(r0-36*3600e3).toISOString()).lt('started_at',new Date(r1).toISOString()).order('started_at',{ascending:true}),
    sb.from('babydaybook_events').select('*').eq('child_id',id).is('ended_at',null).in('type',RUNNING_TYPES)
  ]);
  const err=a.error||b.error;if(err){dbErr(err);return}
  const evs=(a.data||[]).slice();
  for(const x of b.data||[])if(!evs.some(e=>e.id===x.id)&&Date.parse(x.started_at)<r1)evs.push(x);
  S.weekEvents=evs;
  renderWeek();
}
function renderWeek(){
  const ws=S.weekStart,today=todayStr(),cur=weekStartOf(today),days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const fmt=d=>new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',timeZone:TZ}).format(new Date(parisLocalToISO(d,'12:00')));
  const wd=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'short',timeZone:TZ}).format(new Date(parisLocalToISO(d,'12:00')));
  const chev=(d)=>`<path d="${d}"/>`;
  let h=`<div class="wknav"><button class="ibtn" data-act="wprev" aria-label="Semaine précédente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${chev('m15 18-6-6 6-6')}</svg></button>
    <div class="ttl">${ws===cur?'Cette semaine · ':''}${fmt(days[0])} – ${fmt(days[6])}</div>
    <button class="ibtn" data-act="wnext" aria-label="Semaine suivante" ${ws>=cur?'disabled style="opacity:.25"':''}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${chev('m9 18 6-6-6-6')}</svg></button></div>`;
  h+='<div class="wkgrid"><div class="wk wax"><div></div><div class="axis"><div class="in">'+[0,4,8,12,16,20,24].map(k=>`<span style="left:${k/24*100}%">${k}</span>`).join('')+'</div></div></div>';
  for(const d of days){
    const fut=d>today,r=parisDateRange(d),evs=fut?[]:S.weekEvents.filter(e=>overlaps(e,r));
    let cap='';
    if(!fut){
      const sm=summaryData(evs,d),p=[];
      if(sm.sommeil.ms)p.push('🌙 '+fmtHM(sm.sommeil.ms));
      if(sm.allaitement.n)p.push('🤱 '+sm.allaitement.n);
      if(sm.biberon.n)p.push('🍼 '+sm.biberon.n+(sm.biberon.ml?` · ${sm.biberon.ml} ml`:''));
      if(sm.couche.n)p.push('🩲 '+sm.couche.n);
      cap=p.join('  ·  ');
    }
    h+=`<button class="wk${fut?' fut':''}" data-act="gotoDay" data-day="${d}" ${fut?'disabled':''}>
      <div class="wl${d===today?' td':''}">${esc(wd(d).replace('.',''))}<span>${+d.slice(8,10)}</span></div>
      <div><div class="tl">${stripHTML(d,evs,{compact:true,interactive:false})}</div><div class="wsum">${cap}</div></div></button>`;
  }
  $('#pageChrono').innerHTML=h+'</div>';
}

/* ───────── Événements de la page ───────── */
let quickBusy=false;
async function quickAction(type){
  const run=S.running.find(r=>r.type===type);
  if(type==='sommeil'){
    // Un appui démarre le sommeil, le suivant le termine (modification possible depuis la liste).
    if(quickBusy)return;quickBusy=true;
    try{
      if(run){const d=Date.now()-Date.parse(run.started_at);await finishEvent(run);toast(`Réveil · a dormi ${fmtHM(d)}`)}
      else{const row=await insertEvent({type:'sommeil',started_at:new Date().toISOString(),ended_at:null});if(row){await loadAll();toast('Sommeil démarré 🌙')}}
    }finally{quickBusy=false}
    return;
  }
  openEvent(type,run||null);
}
async function sideToggle(e,side){
  const now=new Date(),c=nursingSecs(e,now.getTime()),patch={left_sec:c.l,right_sec:c.r};
  if(e.active_side===side){patch.active_side=null;patch.active_since=null}
  else{patch.active_side=side;patch.active_since=now.toISOString();patch.ended_at=null}
  if(await updateEvent(e.id,patch))await loadAll();
}
async function finishEvent(e){
  const patch={ended_at:new Date().toISOString()};
  if(e.type==='allaitement'){const c=nursingSecs(e);patch.left_sec=c.l;patch.right_sec=c.r;patch.active_side=null;patch.active_since=null}
  if(await updateEvent(e.id,patch))await loadAll();
}
const findEvent=id=>S.events.find(e=>e.id===id)||S.running.find(e=>e.id===id)||S.recent.find(e=>e.id===id);

$('#view').addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id,e=id?findEvent(id):null;
  if(act==='qa'){if(el.dataset.type==='allaitement'||el.dataset.type==='sommeil')askNotif();quickAction(el.dataset.type)}
  else if(act==='edit'&&e)openEvent(e.type,e);
  else if(act==='del'&&e){ev.stopPropagation();if(confirm('Supprimer cette activité ?')&&await deleteEvent(e.id))await loadAll()}
  else if(act==='side'&&e){ev.stopPropagation();askNotif();sideToggle(e,el.dataset.side)}
  else if(act==='finish'&&e){ev.stopPropagation();finishEvent(e)}
  else if(act==='prev'){S.day=addDays(S.day,-1);await loadAll()}
  else if(act==='next'&&S.day<todayStr()){S.day=addDays(S.day,1);await loadAll()}
  else if(act==='today'){S.day=todayStr();await loadAll()}
  else if(act==='toggleSummary'){S.summaryOpen=!S.summaryOpen;renderSummary()}
});
$('#view').addEventListener('change',async ev=>{
  if(ev.target.id==='dayPick'&&ev.target.value){S.day=ev.target.value>todayStr()?todayStr():ev.target.value;await loadAll()}
});
$('#view').addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList.contains('row')){ev.preventDefault();ev.target.click()}});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('header [data-act]');if(!el)return;
  if(el.dataset.act==='childMenu')openChildMenu();
});
$('#tabs').addEventListener('click',ev=>{const b=ev.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
$('#pageChrono').addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='wprev'){S.weekStart=addDays(S.weekStart,-7);await loadWeek()}
  else if(a==='wnext'&&S.weekStart<weekStartOf(todayStr())){S.weekStart=addDays(S.weekStart,7);await loadWeek()}
  else if(a==='gotoDay'){S.day=el.dataset.day;await setTab('home')}
});
$('#pageAccount').addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='editChild'){ev.stopPropagation();openChildModal(S.children.find(c=>c.id===el.dataset.id))}
  else if(a==='pickChild'){selectChild(el.dataset.id);await loadAll()}
  else if(a==='addChild')openChildModal(null);
  else if(a==='changePwd'){
    const v=$('#pw1').value;if(v.length<6){toast('6 caractères minimum');return}
    const{error}=await sb.auth.updateUser({password:v});
    if(error)toast(authErr(error.message));else{toast('Mot de passe modifié ✅');$('#pw1').value=''}
  }
  else if(a==='install')installApp();
  else if(a==='notif')notifButton(el);
  else if(a==='logout')await sb.auth.signOut();
});
// Balayage horizontal pour changer de jour
(function(){
  let x0=null,y0=null;const d=$('#daysec');
  d.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  d.addEventListener('touchend',async e=>{
    if(x0==null)return;
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)<90||Math.abs(dy)>45)return;
    if(dx>0){S.day=addDays(S.day,-1);await loadAll()}
    else if(S.day<todayStr()){S.day=addDays(S.day,1);await loadAll()}
  },{passive:true});
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.child&&!modalEl)loadAll()});
setInterval(tick,1000);
setInterval(()=>{if(!document.hidden&&S.child&&S.running.length)notifSync()},30000);
setInterval(()=>{if(S.child&&!document.hidden){renderQuick();renderTimeline();if(S.tab==='chrono')renderWeek()}},30000);

/* ───────── Authentification ───────── */
let signup=false;
function authErr(m){
  m=(m||'').toLowerCase();
  if(m.includes('invalid login'))return'Email ou mot de passe incorrect.';
  if(m.includes('already registered')||m.includes('already been registered'))return'Un compte existe déjà avec cet email.';
  if(m.includes('at least')||(m.includes('password')&&m.includes('6')))return'Le mot de passe doit contenir au moins 6 caractères.';
  if(m.includes('not confirmed'))return'Email non confirmé : désactive « Confirm email » dans Supabase (Authentication › Providers › Email).';
  if(m.includes('valid email')||m.includes('invalid email'))return'Adresse email invalide.';
  if(m.includes('rate limit'))return'Trop de tentatives, réessaie dans un instant.';
  return'Erreur : '+m;
}
function setSignup(v){
  signup=v;
  $('#authBtn').textContent=v?'Créer mon compte':'Se connecter';
  $('#authToggle').textContent=v?'Déjà un compte ? Se connecter':'Pas encore de compte ? Créer un compte';
  $('#authSub').textContent=v?'Crée ton compte avec ton email et un mot de passe':'Connecte-toi pour retrouver la journée de bébé';
  $('#pwd').autocomplete=v?'new-password':'current-password';
}
function authError(msg){const b=$('#authErr');b.textContent=msg||'';b.classList.toggle('hide',!msg)}
$('#authToggle').addEventListener('click',()=>{authError('');setSignup(!signup)});
$('#authForm').addEventListener('submit',async ev=>{
  ev.preventDefault();authError('');
  if(!sb){authError('Configuration Supabase manquante (clé publique non renseignée).');return}
  const email=$('#email').value.trim(),password=$('#pwd').value,btn=$('#authBtn');
  btn.disabled=true;
  try{
    let res;
    if(signup){
      res=await sb.auth.signUp({email,password});
      if(!res.error&&!res.data.session)res=await sb.auth.signInWithPassword({email,password});
    }else res=await sb.auth.signInWithPassword({email,password});
    if(res.error)authError(authErr(res.error.message));
  }catch(e){authError(authErr(e.message))}
  btn.disabled=false;
});

function showAuth(){
  closeModal();S.child=null;S.children=[];showTab('home');
  $('#boot').classList.add('hide');$('#app').classList.add('hide');$('#auth').classList.remove('hide');
  if(!sb)authError('Configuration Supabase manquante (clé publique non renseignée).');
}
async function bootApp(){
  $('#auth').classList.add('hide');
  if(!await loadChildren()){$('#boot').textContent='Impossible de charger les données.';$('#boot').classList.remove('hide');return}
  $('#boot').classList.add('hide');
  if(!S.children.length){showWelcome();return}
  selectChild(store.get('bdb_child'));
  $('#app').classList.remove('hide');
  showTab('home');
  S.day=todayStr();
  await loadAll();
  const qs=new URLSearchParams(location.search);
  if(qs.get('act')&&qs.get('id')&&!actionHandled){actionHandled=true;handleNotifAction(qs.get('act'),qs.get('id'))}
}
let currentUid=null;
async function route(user){
  S.user=user;
  if(!user){currentUid=null;showAuth();return}
  if(currentUid===user.id)return;
  currentUid=user.id;
  await bootApp();
}
async function init(){
  setSignup(false);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!sb){showAuth();return}
  if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',ev=>{const m=ev.data||{};if(m.type==='act')handleNotifAction(m.act,m.id)});
  sb.auth.onAuthStateChange((evt,session)=>{
    syncAuthToSW(session);
    if(!session)swPost({type:'clear'});
    setTimeout(()=>route(session&&session.user||null),0);
  });
  const{data}=await sb.auth.getSession();
  syncAuthToSW(data.session);
  await route(data.session&&data.session.user||null);
}
init();
})();
